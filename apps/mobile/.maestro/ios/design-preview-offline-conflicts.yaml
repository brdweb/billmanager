appId: com.brdweb.billmanager
name: iOS offline and conflict queue entry
tags:
  - ios
  - preview
  - smoke
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      text: Overview
    timeout: 30000
- tapOn:
    text: ^Settings$
- scrollUntilVisible:
    element:
      text: 'Sync & offline data'
    direction: DOWN
    timeout: 20000
    speed: 40
    visibilityPercentage: 80
- tapOn:
    text: 'Sync & offline data'
- extendedWaitUntil:
    visible:
      text: 'Sync & offline data'
    timeout: 10000
- assertVisible:
    text: Retry now
- assertVisible:
    text: No conflicts need your input
- scrollUntilVisible:
    element:
      text: BillManager syncs changes automatically when a connection is available. You only need to choose when an offline change conflicts with newer server data or changed access.
    direction: DOWN
    timeout: 10000
    visibilityPercentage: 80
- assertVisible:
    text: BillManager syncs changes automatically when a connection is available. You only need to choose when an offline change conflicts with newer server data or changed access.
