buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath("org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:${kotlinVersion}")
  }
}

apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

group = 'com.brdweb.billmanager.widget'
version = '0.1.0'

android {
  namespace "com.brdweb.billmanager.widget"
  buildFeatures {
    compose true
  }
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Match expo-widgets, which depends on androidx.glance:glance:1.2.0. Glance
  // publishes these artifacts as one atomic group, so a lower request is
  // upgraded during resolution. Gradle 9.4.1 (the SDK 58 wrapper) then fails
  // to serialize that upgraded graph:
  // "Problems writing to Binary store" /
  // "No target component for edge ... glance-material3".
  implementation "androidx.glance:glance-appwidget:1.2.0"
  implementation "androidx.glance:glance-material3:1.2.0"
}
