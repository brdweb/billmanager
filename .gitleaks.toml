# Gitleaks configuration for BillManager
# https://github.com/gitleaks/gitleaks

title = "BillManager Secrets Scan"
[[rules]]
id = "postgresql-inline-password"
description = "PostgreSQL URL contains an inline password literal"
regex = 'postgres(ql)?://[^[:space:]/:@]+:[^[:space:]$@][^[:space:]@]*@'
keywords = ["postgres://", "postgresql://"]


[extend]
# Use the default gitleaks config as a base
useDefault = true

# Global allowlist - patterns and paths to always ignore
[allowlist]
paths = [
  '''node_modules/''',
  '''\.git/''',
  '''\./venv/''',
  '''package-lock\.json$''',
  '''\.env\.example$''',
]
# Known test/dev credentials that are not real secrets
regexes = [
  '''testsecret''',
  '''testpassword''',
  '''Strongpass123''',
]
