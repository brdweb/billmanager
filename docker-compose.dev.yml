services:
  billmanager-app:
    build: .
    container_name: billmanager
    ports:
      - "5000:5000"
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://billsuser:${BILLMANAGER_DEV_DB_PASSWORD:?set BILLMANAGER_DEV_DB_PASSWORD}@db:5432/billsdb
      - FLASK_SECRET_KEY=dev-secret-key-change-in-prod
      - DEPLOYMENT_MODE=self-hosted
      # DEFAULT_LOCALE controls regional formatting and defaults to en-US.
      - DEFAULT_LOCALE=${DEFAULT_LOCALE:-en-US}
    depends_on:
      - db

  db:
    image: postgres:17-alpine
    container_name: bills-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=billsuser
      - POSTGRES_PASSWORD=${BILLMANAGER_DEV_DB_PASSWORD:?set BILLMANAGER_DEV_DB_PASSWORD}
      - POSTGRES_DB=billsdb
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
