name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-backend:
    name: Backend Tests & Security
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: billsuser
          POSTGRES_PASSWORD: billspass
          POSTGRES_DB: bills_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://billsuser:billspass@localhost:5432/bills_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: apps/server/requirements.lock

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Verify Python dependency lock
        run: |
          python -m unittest discover -s scripts -p 'test_check_python_lock.py'
          python scripts/check-python-lock.py

      - name: Install Python dependencies
        run: |
          cd apps/server
          pip install -r requirements.lock

      - name: Run pytest (self-hosted)
        env:
          DEPLOYMENT_MODE: self-hosted
        run: |
          cd apps/server
          pytest -v --cov=. --cov-report=xml --cov-report=term-missing

      - name: Run pytest (SaaS)
        env:
          DEPLOYMENT_MODE: saas
        run: |
          cd apps/server
          pytest -v --cov=. --cov-append --cov-report=xml --cov-report=term-missing

      - name: Run bandit security scan
        run: |
          cd apps/server
          bandit -r . -x tests -c bandit.yaml -f txt

      - name: Run pip-audit
        run: |
          pip-audit -r apps/server/requirements.lock

  test-frontend:
    name: Frontend Tests & Security
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd apps/web
          npm ci

      - name: Run vitest with coverage
        run: |
          cd apps/web
          npm run test:coverage

      - name: Run ESLint
        run: |
          cd apps/web
          npm run lint

      - name: Build frontend (TypeScript check)
        run: |
          cd apps/web
          npm run build

      - name: Run npm audit
        run: |
          cd apps/web
          npm audit --audit-level=high

  test-mobile:
    name: Mobile Contract, Tests & SDK Compatibility
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect mobile changes requiring Expo compatibility
        id: mobile-scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [[ "$REF_TYPE" == "tag" ]]; then
            echo "expo_check=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            from_sha="$BASE_SHA"
          else
            from_sha="$BEFORE_SHA"
          fi

          if [[ -z "$from_sha" || "$from_sha" =~ ^0+$ ]]; then
            echo "expo_check=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git cat-file -e "${from_sha}^{commit}" ||
             ! git cat-file -e "${HEAD_SHA}^{commit}"; then
            echo "expo_check=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! changed_paths="$(git diff --name-only "$from_sha" "$HEAD_SHA")"; then
            echo "expo_check=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          expo_check=false
          while IFS= read -r path; do
            case "$path" in
              apps/mobile/*)
                expo_check=true
                break
                ;;
            esac
          done <<< "$changed_paths"

          echo "expo_check=$expo_check" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          cache: 'npm'
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install mobile dependencies
        run: |
          cd apps/mobile
          npm ci

      - name: Verify shared translations are synchronized
        run: |
          cd apps/mobile
          npm run i18n:sync
          git diff --exit-code -- src/i18n/locales

      - name: Verify generated API contract is synchronized
        run: |
          cd apps/mobile
          npm run api:check

      - name: Run mobile lint, typecheck, and tests
        run: |
          cd apps/mobile
          npm run lint
          npm run typecheck
          npm test

      - name: Validate Maestro device-flow definitions
        run: |
          cd apps/mobile
          npm run maestro:validate

      - name: Validate native build transport profiles
        run: |
          cd apps/mobile
          npm run config:validate

      - name: Verify Expo SDK compatibility
        if: steps.mobile-scope.outputs.expo_check == 'true'
        run: |
          cd apps/mobile
          npx expo install --check
          npm run doctor

      - name: Run mobile npm audit
        run: |
          cd apps/mobile
          npm run audit

  security-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Validate Docker Image
    if: github.event_name == 'pull_request'
    needs: [test-backend, test-frontend, test-mobile, security-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
