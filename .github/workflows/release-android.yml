name: Android Release

on:
  push:
    tags:
      - 'mobile-v*'
  workflow_dispatch:
    inputs:
      action:
        description: Release action to perform
        required: true
        default: build
        type: choice
        options:
          - build
          - submit
      build_id:
        description: Existing EAS build ID to submit
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Android Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Restrict manual release ref
        if: github.event_name == 'workflow_dispatch'
        env:
          REF: ${{ github.ref }}
        run: |
          case "$REF" in
            refs/heads/main | refs/tags/mobile-v*)
              ;;
            *)
              echo "::error::Manual Android releases must run from main or a mobile-v* tag."
              exit 1
              ;;
          esac

      - name: Verify mobile tag is on main
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'mobile-v')
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::Mobile release tags must point to a commit contained in origin/main."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Validate mobile release tag
        if: github.ref_type == 'tag'
        env:
          TAG_NAME: ${{ github.ref_name }}
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          expected="mobile-v${version}"

          case "$TAG_NAME" in
            "$expected")
              ;;
            "$expected"-build*)
              build_number="${TAG_NAME#"$expected"-build}"
              if [[ ! "$build_number" =~ ^[0-9]+$ ]]; then
                echo "::error::Tag must be ${expected} or ${expected}-build<N>."
                exit 1
              fi
              ;;
            *)
              echo "::error::Tag must be ${expected} or ${expected}-build<N>."
              exit 1
              ;;
          esac

      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Run mobile release checks
        working-directory: apps/mobile
        run: npm run check

  build:
    name: Build Android Release
    if: github.event_name == 'push' || inputs.action == 'build'
    needs: validate
    runs-on: ubuntu-latest
    environment: android-production
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Build Android with EAS
        working-directory: apps/mobile
        run: npx --yes eas-cli@16.28.0 build --platform android --profile production --non-interactive --wait --json > eas-android-build.json

      - name: Extract EAS build ID
        id: build-metadata
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          build_id="$(jq -er '
            if type == "array" and length > 0 and (.[0].id | type == "string") and (.[0].id | length > 0)
            then .[0].id
            else error("EAS build output does not contain a first build ID")
            end
          ' eas-android-build.json)"
          printf 'build_id=%s\n' "$build_id" >> "$GITHUB_OUTPUT"

      - name: Upload EAS build metadata
        uses: actions/upload-artifact@v4
        with:
          name: android-eas-build-metadata
          path: apps/mobile/eas-android-build.json
          retention-days: 90

      - name: Write build summary
        env:
          BUILD_ID: ${{ steps.build-metadata.outputs.build_id }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
        run: |
          {
            echo "## Android EAS build"
            echo
            echo "- Build ID: \`$BUILD_ID\`"
            echo "- Commit: \`$SHA\`"
            echo "- Ref: \`$REF\`"
          } >> "$GITHUB_STEP_SUMMARY"

  submit:
    name: Submit Android Release
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'submit'
    needs: validate
    runs-on: ubuntu-latest
    environment: android-production
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      BUILD_ID: ${{ inputs.build_id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Require EAS build ID
        run: |
          if [[ -z "${BUILD_ID//[[:space:]]/}" ]]; then
            echo "::error::A build ID is required for submission."
            exit 1
          fi

      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Submit Android build with EAS
        working-directory: apps/mobile
        run: npx --yes eas-cli@16.28.0 submit --platform android --profile production --id "$BUILD_ID" --non-interactive

      - name: Write submission summary
        env:
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
        run: |
          {
            echo "## Android EAS submission"
            echo
            echo "- Build ID: \`$BUILD_ID\`"
            echo "- Commit: \`$SHA\`"
            echo "- Ref: \`$REF\`"
          } >> "$GITHUB_STEP_SUMMARY"
