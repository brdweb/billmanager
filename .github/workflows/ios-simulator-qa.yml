name: iOS Simulator QA

on:
  workflow_dispatch:
    inputs:
      authenticated:
        description: Capture synthetic reviewer screens (requires production approval)
        type: boolean
        default: false
      pinned_run_id:
        description: Optional earlier manual main run ID whose verified native archive to reuse for authenticated capture (empty builds fresh)
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: ios-simulator-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    name: Native Release simulator smoke
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 120
    environment: ${{ inputs.authenticated && 'ios-production' || '' }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      BILLMANAGER_DEVELOPMENT_BUILD: 'false'
      EXPO_PUBLIC_DESIGN_PREVIEW: '0'
      EXPO_NO_DOTENV: '1'
      EXPO_NO_TELEMETRY: '1'
      SENTRY_DSN: ''
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'
      CI: '1'
    steps:
      - name: Checkout exact reviewed main revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Set up Java for Maestro
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Install locked mobile dependencies
        working-directory: apps/mobile
        run: npm ci
      - name: Validate source and flow definitions
        working-directory: apps/mobile
        run: |
          npm run i18n:check
          npm run maestro:validate
          npm test -- scripts/ios-simulator-qa.test.mjs scripts/ios-simulated-entitlements.test.mjs scripts/ios-qa-devices.test.mjs scripts/ios-store-capture.test.mjs scripts/ios-qa-reuse.test.mjs scripts/ios-simulator-readiness.test.mjs
      - name: Install verified Maestro CLI
        env:
          MAESTRO_VERSION: 2.12.0
          MAESTRO_SHA256: a6044a84542f522f434c5dc3d609e60c7446d423f3ed1b2ae513f5c48663ec5e
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/maestro.zip"
          curl --fail --location --retry 3 "https://github.com/mobile-dev-inc/Maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip" --output "$archive"
          printf '%s  %s\n' "$MAESTRO_SHA256" "$archive" | shasum -a 256 --check
          unzip -q "$archive" -d "$RUNNER_TEMP/maestro"
          printf '%s\n' "$RUNNER_TEMP/maestro/maestro/bin" >> "$GITHUB_PATH"
      - name: Verify and reuse a pinned native Simulator archive
        if: inputs.pinned_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CAPTURE_ENABLED: ${{ inputs.authenticated }}
          PINNED_RUN_ID: ${{ inputs.pinned_run_id }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$CAPTURE_ENABLED" == true ]]
          [[ "$PINNED_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          metadata="$RUNNER_TEMP/billmanager-ios-reuse-metadata"
          incoming="$RUNNER_TEMP/billmanager-ios-reuse"
          mkdir -p "$metadata" "$incoming"
          repo=brdweb/billmanager
          gh api "repos/$repo/actions/runs/$PINNED_RUN_ID" > "$metadata/run.json"
          gh api "repos/$repo/actions/runs/$PINNED_RUN_ID/jobs?per_page=100" > "$metadata/jobs.json"
          gh api "repos/$repo/actions/runs/$PINNED_RUN_ID/artifacts?per_page=100" > "$metadata/artifacts.json"
          # Validates run identity, build success and an unexpired same-commit artifact before download.
          source_sha="$(node apps/mobile/scripts/ios-qa-reuse.mjs preflight "$metadata" "$PINNED_RUN_ID")"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          gh api "repos/$repo/compare/$source_sha...$GITHUB_SHA" \
            --jq '{status: .status, base: .base_commit.sha, merge_base: .merge_base_commit.sha}' > "$metadata/comparison.json"
          # Rechecks the run and requires its commit to be contained in the current main before download.
          [[ "$(node apps/mobile/scripts/ios-qa-reuse.mjs contained "$metadata" "$PINNED_RUN_ID")" == "$source_sha" ]]
          gh run download "$PINNED_RUN_ID" --repo "$repo" --name "ios-simulator-qa-$source_sha" --dir "$incoming"
          node apps/mobile/scripts/ios-qa-reuse.mjs "$metadata" "$incoming" "$PINNED_RUN_ID"
      - name: Build and exercise the native Simulator app
        if: inputs.pinned_run_id == ''
        env:
          IOS_QA_AUTHENTICATED: ${{ inputs.authenticated }}
        run: bash apps/mobile/scripts/ios-simulator-qa.sh
      - name: Prepare both Simulator devices without reviewer credentials
        if: inputs.authenticated
        working-directory: apps/mobile
        run: node scripts/ios-simulator-readiness.mjs
      - name: Install verified age for sealed failure diagnostics
        if: inputs.authenticated && vars.QA_DIAGNOSTICS_AGE_RECIPIENT != ''
        # Optional: without age the capture still runs and reports encrypt_failed.
        continue-on-error: true
        env:
          AGE_VERSION: v1.3.2
          AGE_SHA256: e2020b073c44f692685a24d6abc378817eb81ffaaf49fd0531ef8565f767f2f5
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/age.tar.gz"
          curl --fail --location --retry 3 "https://github.com/FiloSottile/age/releases/download/${AGE_VERSION}/age-${AGE_VERSION}-darwin-arm64.tar.gz" --output "$archive"
          printf '%s  %s\n' "$AGE_SHA256" "$archive" | shasum -a 256 --check
          mkdir -p "$RUNNER_TEMP/age-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/age-bin" --strip-components 1 age/age
          printf '%s\n' "$RUNNER_TEMP/age-bin" >> "$GITHUB_PATH"
      - name: Capture private synthetic reviewer screens
        if: inputs.authenticated
        working-directory: apps/mobile
        env:
          QA_REVIEWER_PASSWORD: ${{ secrets.QA_REVIEWER_PASSWORD }}
          # Public age recipient only. Raw failure output is uploaded solely as ciphertext
          # that the operator decrypts locally with the matching private key.
          QA_DIAGNOSTICS_AGE_RECIPIENT: ${{ vars.QA_DIAGNOSTICS_AGE_RECIPIENT }}
        run: |
          set +x
          printf '%s' "$QA_REVIEWER_PASSWORD" | env -u QA_REVIEWER_PASSWORD node scripts/ios-store-capture.mjs
      - name: Shut down only task Simulator devices
        if: always() && inputs.authenticated
        working-directory: apps/mobile
        run: node scripts/ios-simulator-readiness.mjs --cleanup
      - name: Upload bounded native QA evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-simulator-qa-${{ github.sha }}
          # Explicit allowlist. Never upload private Maestro debug/hierarchy/logs.
          path: |
            ${{ runner.temp }}/billmanager-ios-qa/manifest.json
            ${{ runner.temp }}/billmanager-ios-qa/result.json
            ${{ runner.temp }}/billmanager-ios-qa/selected-devices.json
            ${{ runner.temp }}/billmanager-ios-qa/store-capture.json
            ${{ runner.temp }}/billmanager-ios-qa/sealed-capture-failure.tar.age
            ${{ runner.temp }}/billmanager-ios-qa/simulator-readiness.json
            ${{ runner.temp }}/billmanager-ios-qa/simulator-cleanup.json
            ${{ runner.temp }}/billmanager-ios-qa/store-screenshots/*.png
            ${{ runner.temp }}/billmanager-ios-qa/BillManager-simulator.app.zip
            ${{ runner.temp }}/billmanager-ios-qa/binary-architectures.txt
            ${{ runner.temp }}/billmanager-ios-qa/xcode-build.log
            ${{ runner.temp }}/billmanager-ios-qa/iphone/maestro.xml
            ${{ runner.temp }}/billmanager-ios-qa/ipad/maestro.xml
            ${{ runner.temp }}/billmanager-ios-qa/iphone/screenshots/**/auth-login.png
            ${{ runner.temp }}/billmanager-ios-qa/iphone/screenshots/**/auth-password-recovery.png
            ${{ runner.temp }}/billmanager-ios-qa/ipad/screenshots/**/auth-login.png
            ${{ runner.temp }}/billmanager-ios-qa/ipad/screenshots/**/auth-password-recovery.png
          if-no-files-found: warn
          retention-days: 14
      - name: Explain acceptance boundary
        if: always()
        run: |
          {
            echo '## iOS Simulator QA'
            echo '- Source: `${{ github.sha }}` (main)'
            echo '- Native Release / iOS Simulator; unsigned, not a device/store artifact.'
            echo '- HTTPS-only app policy; generated OTA disabled and Sentry upload disabled.'
            echo '- Anonymous by default; optional approved synthetic reviewer read-only screens on iPhone and iPad.'
            echo '- Inspect manifest, JUnit, screenshots and native logs; a failed job is not acceptance.'
            echo '- Physical-device, signing, authenticated flows and production diagnostics remain separate gates.'
          } >> "$GITHUB_STEP_SUMMARY"
