name: Sync server Python lock

# Dependabot's pip updater edits apps/server/requirements.txt and does not
# regenerate apps/server/requirements.lock. CI compiles the manifest with the
# lock as a constraint, so those pull requests fail until the lock moves.
# This workflow recompiles with --upgrade-package for the direct requirements
# that changed (Python 3.14, --no-header), which leaves every other pin alone.
#
# The lock commit is pushed with a GitHub App installation token. A push
# authenticated as GITHUB_TOKEN does not start CI: push workflows are skipped,
# and a pull_request synchronize is left waiting for a maintainer to approve
# workflow runs. The app token is an ordinary git push, so the existing
# pull_request CI runs on the lock commit.
#
# That push starts this workflow again, because the pull request author is
# still Dependabot and requirements.txt is still part of the diff. The new
# run exits before compiling when the branch tip is the sync commit, so it
# does not push a second time.

on:
  pull_request:
    branches: [main]
    paths:
      - apps/server/requirements.txt

permissions: {}

concurrency:
  group: sync-python-lock-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  sync-lock:
    name: Recompile requirements.lock
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Skip the workflow's own lock commit
        id: guard
        env:
          SYNC_SUBJECT: chore(deps): sync requirements.lock for Dependabot
        run: |
          set -euo pipefail
          subject="$(git log -1 --format=%s)"
          if [[ "$subject" == "$SYNC_SUBJECT" ]] &&
             ! git diff-tree --no-commit-id --name-only -r HEAD | grep -qx 'apps/server/requirements.txt'; then
            echo "Branch tip is the lock sync commit; not compiling again."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require the lock-sync GitHub App
        if: steps.guard.outputs.skip != 'true'
        env:
          APP_ID: ${{ secrets.PYTHON_LOCK_SYNC_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.PYTHON_LOCK_SYNC_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${APP_ID}" || -z "${APP_PRIVATE_KEY}" ]]; then
            echo "::error::Dependabot secrets PYTHON_LOCK_SYNC_APP_ID and PYTHON_LOCK_SYNC_APP_PRIVATE_KEY are not set. Actions secrets are not available on Dependabot pull requests. Create a GitHub App with Contents: Read and write on this repository, install it here, and store the App ID and PEM private key as Dependabot secrets."
            exit 1
          fi

      - name: Create GitHub App token
        if: steps.guard.outputs.skip != 'true'
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.PYTHON_LOCK_SYNC_APP_ID }}
          private-key: ${{ secrets.PYTHON_LOCK_SYNC_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Set up Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Set up uv
        if: steps.guard.outputs.skip != 'true'
        uses: astral-sh/setup-uv@v7

      - name: Recompile the lock for changed direct requirements
        if: steps.guard.outputs.skip != 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$BASE_REF" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "Unexpected base ref." >&2
            exit 1
          fi
          git -c "http.extraheader=AUTHORIZATION: bearer ${GH_TOKEN}" fetch --no-tags origin \
            "refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          merge_base="$(git merge-base HEAD "refs/remotes/origin/${BASE_REF}")"
          git show "${merge_base}:apps/server/requirements.txt" > "${RUNNER_TEMP}/base-requirements.txt"

          set +e
          packages="$(python scripts/sync-python-lock.py --base "${RUNNER_TEMP}/base-requirements.txt" --head apps/server/requirements.txt)"
          status=$?
          set -e
          if [[ "$status" -eq 2 ]]; then
            echo "Direct requirements are unchanged. Leaving the lock alone."
            exit 0
          fi
          if [[ "$status" -ne 0 ]]; then
            exit "$status"
          fi

          cmd=(
            uv pip compile apps/server/requirements.txt
            --python-version 3.14
            --no-header
            --output-file apps/server/requirements.lock
          )
          if [[ -n "$packages" ]]; then
            while IFS= read -r package; do
              [[ -z "$package" ]] && continue
              if [[ ! "$package" =~ ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$ ]]; then
                echo "Refusing unexpected package name: ${package}" >&2
                exit 1
              fi
              cmd+=(--upgrade-package "$package")
            done <<< "$packages"
          fi
          cmd+=(--quiet)
          printf 'Compiling with:'
          printf ' %q' "${cmd[@]}"
          printf '\n'
          "${cmd[@]}"

          if git diff --quiet -- apps/server/requirements.lock; then
            echo "Scoped compile did not change apps/server/requirements.lock."
            exit 0
          fi
          git diff -- apps/server/requirements.lock

      - name: Push the updated lock
        if: steps.guard.outputs.skip != 'true'
        env:
          PYTHON_LOCK_SYNC_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          SYNC_SUBJECT: chore(deps): sync requirements.lock for Dependabot
        run: |
          set -euo pipefail
          if [[ ! "$HEAD_REF" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "Unexpected head ref." >&2
            exit 1
          fi
          if git diff --quiet -- apps/server/requirements.lock; then
            echo "No lock change to push."
            exit 0
          fi
          # Only the lock file. A manifest edit would retrigger this workflow.
          git add -- apps/server/requirements.lock
          staged="$(git diff --cached --name-only)"
          if [[ "$staged" != 'apps/server/requirements.lock' ]]; then
            echo "Refusing to commit unexpected files:" >&2
            printf '%s\n' "$staged" >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "${SYNC_SUBJECT}" -m "Recompile apps/server/requirements.lock with --upgrade-package for the direct requirements this pull request changed. Other locked packages stay at their current pins."

          askpass="${RUNNER_TEMP}/git-askpass.sh"
          printf '%s\n' '#!/bin/sh' 'case "$1" in' \
            '*Username*) printf "%s\n" "x-access-token" ;;' \
            '*) printf "%s\n" "$PYTHON_LOCK_SYNC_TOKEN" ;;' \
            'esac' > "$askpass"
          chmod 700 "$askpass"
          # Askpass keeps the app token out of the remote URL and out of
          # GITHUB_TOKEN's credential helper. persist-credentials is false,
          # so this push is not attributed to GITHUB_TOKEN.
          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 \
            git push "https://x-access-token@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${HEAD_REF}"
          rm -f "$askpass"
